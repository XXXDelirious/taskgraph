name: PR Build

# Builds snapshot binaries for pull requests labelled "needs-build".
# Uses `pull_request` (not `pull_request_target`) so untrusted PR code never
# runs with write access to the repository.
on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  build:
    if: contains(github.event.pull_request.labels.*.name, 'needs-build')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.x"
          cache: true
      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --config .goreleaser-pr.yml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taskgraph-binaries
          path: |
            dist/taskgraph_*.tar.gz
            dist/taskgraph_*.zip
            dist/taskgraph_checksums.txt
