# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: taskgraph

builds:
  - binary: taskgraph
    main: ./cmd/taskgraph
    goos:
      - windows
      - darwin
      - linux
      - freebsd
    goarch:
      - '386'
      - amd64
      - arm
      - arm64
      - riscv64
    goarm:
      - '6'
    ignore:
      - goos: darwin
        goarch: '386'
      - goos: darwin
        goarch: riscv64
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: riscv64
    env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - "-s -w"

gomod:
  proxy: true

archives:
  - name_template: '{{.Binary}}_{{.Os}}_{{.Arch}}'
    files:
      - README.md
      - LICENSE
      - completion/**/*
    format_overrides:
      - goos: windows
        formats: [zip]

snapshot:
  version_template: '{{.Version}}-snapshot'

checksum:
  name_template: 'taskgraph_checksums.txt'

release:
  github:
    owner: XXXDelirious
    name: taskgraph

nfpms:
  - vendor: taskgraph
    homepage: https://github.com/XXXDelirious/taskgraph
    maintainer: XXXDelirious <XXXDelirious@users.noreply.github.com>
    description: A Task-compatible task runner built for AI coding agents and monorepos.
    section: golang
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    file_name_template: '{{.ProjectName}}_{{.Version}}_{{.Os}}_{{.Arch}}'
    contents:
      - src: completion/bash/taskgraph.bash
        dst: /etc/bash_completion.d/taskgraph
      - src: completion/fish/taskgraph.fish
        dst: /usr/share/fish/vendor_completions.d/taskgraph.fish
      - src: completion/zsh/_taskgraph
        dst: /usr/local/share/zsh/site-functions/_taskgraph
